[project]
name = "jobpilot-ai-service"
version = "0.1.0"
description = "JobPilot internal AI service"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = [
    "pdfplumber",
    "pdfplumber.*",
    "pymupdf",
    "pymupdf.*",
    "fitz",
    "fitz.*",
    "docx",
    "docx.*",
    "pdf2image",
    "pdf2image.*",
    "pytesseract",
    "pytesseract.*",
    "PIL",
    "PIL.*",
    "rank_bm25",
    "rank_bm25.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "sentence_transformers",
    "sentence_transformers.*",
    "torch",
    "torch.*",
    "transformers",
    "transformers.*",
    "docx",
    "docx.*",
]
ignore_missing_imports = true
follow_imports = "skip"
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
